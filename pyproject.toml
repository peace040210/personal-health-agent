[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-health-agent"
version = "0.1.0"
requires-python = ">=3.11"
description = "Local sleep and activity analytics tools"

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]
web = ["fastapi>=0.115,<1", "pydantic>=2,<3", "uvicorn>=0.32,<1"]
test = ["httpx>=0.27,<1"]

[tool.setuptools]
packages = ["health_agent"]
include-package-data = false

[tool.setuptools.package-data]
health_agent = ["skillpacks/*/*/SKILL.md", "skillpacks/*/*/*.json", "skillpacks/*/*/references/*.md", "evals/*.json", "web_samples/*.json"]
